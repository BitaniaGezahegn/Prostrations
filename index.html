<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prostration Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h1>Prostration Counter</h1>
        
        <div class="video-wrapper">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output_canvas"></canvas>
        </div>

        <div class="controls">
            <button id="webcamButton" class="btn">ENABLE WEBCAM</button>
            <div id="calibrationSection" class="hidden">
                <p id="calibrationStatus">Status: Uncalibrated</p>
                <button id="calibrateButton" class="btn">CALIBRATE</button>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
